<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5f3f" />
    <meta name="description" content="麻雀の点数計算と、対局の点棒管理・成績の記録" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="点数計算" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>麻雀点数計算</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 保存しておいた画面が壊れていて何も表示されないときは、保存を消して1回だけ読み込み直す
      setTimeout(async () => {
        if (document.getElementById('root').hasChildNodes()) return;
        try {
          if (sessionStorage.getItem('mahjong-score.recovered')) return;
          sessionStorage.setItem('mahjong-score.recovered', '1');
          for (const r of (await navigator.serviceWorker?.getRegistrations()) ?? []) await r.unregister();
          for (const k of await caches.keys()) await caches.delete(k);
        } catch {
          return;
        }
        location.reload();
      }, 5000);
    </script>
  </body>
</html>
